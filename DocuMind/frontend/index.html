<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocuMind — Tutor acadêmico</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  .md p{margin:.4rem 0} .md ul{list-style:disc;padding-left:1.25rem;margin:.4rem 0}
  .md ol{list-style:decimal;padding-left:1.25rem;margin:.4rem 0} .md h1,.md h2,.md h3{font-weight:600;margin:.6rem 0 .2rem}
  .md blockquote{border-left:3px solid #cbd5e1;padding-left:.75rem;color:#475569}
  .cite{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:.375rem;padding:0 .35rem;font-size:.72rem;font-weight:600;margin:0 .1rem}
  .drop.over{border-color:#4f46e5;background:#eef2ff}
  .dots span{animation:b 1s infinite;display:inline-block} .dots span:nth-child(2){animation-delay:.15s} .dots span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.2}40%{opacity:1}}
</style>
</head>
<body class="h-screen bg-slate-50 text-slate-800 flex">

<!-- Sidebar -->
<aside class="w-80 shrink-0 bg-white border-r border-slate-200 p-5 flex flex-col gap-5 overflow-y-auto">
  <div>
    <h1 class="text-xl font-bold text-indigo-700">📚 DocuMind</h1>
    <p class="text-xs text-slate-500">Tutor acadêmico baseado no seu material</p>
  </div>

  <label id="drop" class="drop cursor-pointer border-2 border-dashed border-slate-300 rounded-xl p-5 text-center text-sm text-slate-500 hover:border-indigo-400 transition">
    <input id="file" type="file" accept="application/pdf" class="hidden">
    <div class="text-2xl mb-1">📄</div>
    <div><b class="text-slate-700">Envie um PDF</b><br>artigo, TCC, monografia, apostila</div>
  </label>
  <div id="status" class="text-xs text-slate-500 hidden"></div>

  <div id="docinfo" class="hidden rounded-xl bg-indigo-50 border border-indigo-100 p-3 text-sm">
    <div class="font-semibold text-indigo-900 break-words" id="docname"></div>
    <div class="text-xs text-indigo-700 mt-1" id="docmeta"></div>
  </div>

  <div id="quick" class="hidden">
    <div class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-2">Atalhos de estudo</div>
    <div class="flex flex-col gap-2">
      <button class="qp text-left text-sm rounded-lg border border-slate-200 px-3 py-2 hover:bg-slate-50">📝 Resumir o documento</button>
      <button class="qp text-left text-sm rounded-lg border border-slate-200 px-3 py-2 hover:bg-slate-50">🔑 Conceitos-chave explicados</button>
      <button class="qp text-left text-sm rounded-lg border border-slate-200 px-3 py-2 hover:bg-slate-50">🧪 Qual é a metodologia?</button>
      <button class="qp text-left text-sm rounded-lg border border-slate-200 px-3 py-2 hover:bg-slate-50">❓ Gerar perguntas de revisão</button>
    </div>
  </div>
  <p class="mt-auto text-[11px] text-slate-400">Respostas baseadas somente no PDF enviado, com indicação de página.</p>
</aside>

<!-- Chat -->
<main class="flex-1 flex flex-col min-w-0">
  <div id="chat" class="flex-1 overflow-y-auto p-6 space-y-5">
    <div class="max-w-xl mx-auto mt-20 text-center text-slate-400">
      <div class="text-5xl mb-3">🎓</div>
      <p>Envie um documento acadêmico para começar a estudar.</p>
    </div>
  </div>
  <div class="border-t border-slate-200 bg-white p-4">
    <div class="max-w-3xl mx-auto flex gap-3 items-end">
      <textarea id="input" rows="1" disabled placeholder="Pergunte sobre o documento… (Enter envia, Shift+Enter quebra linha)"
        class="flex-1 resize-none rounded-xl border border-slate-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 disabled:bg-slate-100"></textarea>
      <button id="send" disabled class="rounded-xl bg-indigo-600 text-white px-5 py-3 text-sm font-medium hover:bg-indigo-700 disabled:opacity-40">Enviar</button>
    </div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const chat = $('#chat'), input = $('#input'), sendBtn = $('#send'), statusEl = $('#status');
let docId = null, history = [], busy = false;

function renderMd(md) {
  const html = DOMPurify.sanitize(marked.parse(md, { breaks: true }));
  return html.replace(/\((pp?\.\s?[^()<>]{1,40})\)/g, '<span class="cite">$1</span>');
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function scrollDown() { chat.scrollTop = chat.scrollHeight; }
function setStatus(msg, err = false) {
  statusEl.textContent = msg; statusEl.className = 'text-xs ' + (err ? 'text-red-600' : 'text-slate-500');
  statusEl.classList.toggle('hidden', !msg);
}

// ---------- upload
async function upload(file) {
  if (!file) return;
  setStatus('⏳ Processando PDF…');
  const fd = new FormData(); fd.append('file', file);
  try {
    const r = await fetch('/api/documents', { method: 'POST', body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || 'Falha no upload');
    docId = j.id; history = [];
    $('#docname').textContent = '📄 ' + j.filename;
    $('#docmeta').textContent = `${j.pages} páginas · ${j.chunks} trechos indexados · ${j.elapsed}s`;
    $('#docinfo').classList.remove('hidden'); $('#quick').classList.remove('hidden');
    chat.innerHTML = '';
    addNote('Documento pronto. Pergunte sobre conceitos, métodos, resultados ou peça um resumo.');
    if (j.warning) addNote('⚠️ ' + j.warning);
    setStatus('');
    input.disabled = false; sendBtn.disabled = false; input.focus();
  } catch (e) { setStatus('❌ ' + e.message, true); }
}
$('#file').addEventListener('change', (e) => upload(e.target.files[0]));
const drop = $('#drop');
['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => upload(e.dataTransfer.files[0]));

// ---------- mensagens
function addNote(text) {
  const d = document.createElement('div');
  d.className = 'max-w-3xl mx-auto text-center text-xs text-slate-400';
  d.textContent = text; chat.appendChild(d); scrollDown();
}
function addUser(text) {
  const d = document.createElement('div'); d.className = 'max-w-3xl mx-auto flex justify-end';
  d.innerHTML = `<div class="bg-indigo-600 text-white rounded-2xl rounded-br-sm px-4 py-2 text-sm max-w-[85%] whitespace-pre-wrap">${esc(text)}</div>`;
  chat.appendChild(d); scrollDown();
}
function addAssistant() {
  const wrap = document.createElement('div'); wrap.className = 'max-w-3xl mx-auto';
  wrap.innerHTML = `
    <div class="bg-white border border-slate-200 rounded-2xl rounded-bl-sm px-4 py-3 text-sm shadow-sm">
      <div class="md body"><span class="dots text-slate-400"><span>●</span><span>●</span><span>●</span></span></div>
      <details class="src hidden mt-3 text-xs text-slate-500"><summary class="cursor-pointer select-none">📎 Trechos consultados</summary><ul class="mt-2 space-y-1"></ul></details>
      <div class="timer mt-3 text-xs font-medium text-emerald-700">⏱️ calculando…</div>
    </div>`;
  chat.appendChild(wrap); scrollDown();
  return wrap;
}

// ---------- envio com streaming
async function ask(question) {
  if (busy || !docId || !question.trim()) return;
  busy = true; sendBtn.disabled = true; input.value = ''; input.style.height = 'auto';
  addUser(question);
  const box = addAssistant();
  const body = box.querySelector('.body'), timer = box.querySelector('.timer');
  const tStart = performance.now();
  const tick = setInterval(() => { timer.textContent = `⏱️ gerando… ${((performance.now() - tStart) / 1000).toFixed(1)}s`; }, 100);
  let text = '', dirty = false, failed = false;
  const paint = () => { if (dirty) { body.innerHTML = renderMd(text); dirty = false; scrollDown(); } requestAnimationFrame(paint); };
  const raf = requestAnimationFrame(paint);

  const handle = (ev) => {
    if (ev.type === 'sources') {
      const ul = box.querySelector('.src ul');
      ev.sources.forEach(s => { const li = document.createElement('li'); li.innerHTML = `<b>p. ${s.page}</b> · ${esc(s.section)} — <span class="text-slate-400">${esc(s.preview)}…</span>`; ul.appendChild(li); });
      box.querySelector('.src').classList.remove('hidden');
    } else if (ev.type === 'token') { text += ev.text; dirty = true; }
    else if (ev.type === 'error') { failed = true; text += `\n\n❌ ${ev.message}`; dirty = true; }
    else if (ev.type === 'done') {
      clearInterval(tick);
      timer.textContent = `⏱️ Resposta gerada em ${ev.elapsed.toFixed(2)} segundos`;
      if (ev.ttft) timer.title = `Primeiro token em ${ev.ttft}s · recuperação ${ev.retrieval_ms} ms`;
    }
  };

  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doc_id: docId, question, history: history.slice(-6) }),
    });
    if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.detail || 'Erro na requisição'); }
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf('\n')) >= 0) { const l = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if (l) handle(JSON.parse(l)); }
    }
  } catch (e) { failed = true; text += `❌ ${e.message}`; dirty = true; }
  finally {
    clearInterval(tick); cancelAnimationFrame(raf);
    body.innerHTML = renderMd(text); scrollDown();
    if (timer.textContent.includes('gerando') || timer.textContent.includes('calculando')) timer.textContent = `⏱️ Interrompido após ${((performance.now() - tStart) / 1000).toFixed(2)} segundos`;
    if (!failed) history.push({ role: 'user', content: question }, { role: 'assistant', content: text });
    busy = false; sendBtn.disabled = false; input.focus();
  }
}

sendBtn.addEventListener('click', () => ask(input.value));
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px'; });
const prompts = [
  'Resuma o documento: objetivo, metodologia, principais resultados e conclusões.',
  'Quais são os conceitos-chave deste documento? Explique cada um de forma didática.',
  'Descreva a metodologia utilizada, com o máximo de detalhes que o texto trouxer.',
  'Gere 5 perguntas de revisão sobre o documento, com respostas e a página de cada uma.',
];
document.querySelectorAll('.qp').forEach((b, i) => b.addEventListener('click', () => ask(prompts[i])));
</script>
</body>
</html>
